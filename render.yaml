services:
  - type: web
    name: mergington-activities-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /activities
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
